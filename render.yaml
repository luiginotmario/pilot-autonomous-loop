services:
  - type: web
    name: pilot-api
    runtime: node
    buildCommand: npm ci --include=dev && npx playwright install --with-deps chromium && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: PERSIMMON_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
